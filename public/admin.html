<!doctype html>
<html lang="id" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard Admin | Indi Nasya Putri</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { padding: 2rem 0 4rem; }
    .thumb { width: 64px; height: 48px; object-fit: cover; border-radius: 8px; background: rgba(255,255,255,.08); }
  </style>
</head>
<body>
  <div class="container" style="max-width: 920px;">

    <!-- Pesan sukses atau gagal -->
    <div id="pesan" class="alert d-none" role="alert"></div>

    <!-- Tampilan login -->
    <section id="tampilanLogin" class="d-none">
      <div class="kartu-kaca p-4 mx-auto" style="max-width: 420px;">
        <h1 class="h4 mb-3">Masuk Dashboard</h1>
        <form id="formLogin">
          <label for="password" class="form-label">Kata sandi</label>
          <input type="password" id="password" class="form-control mb-3" autocomplete="current-password" required>
          <button type="submit" class="btn btn-utama w-100">Masuk</button>
        </form>
        <a href="/" class="d-block text-center mt-3 teks-redup">← Kembali ke website</a>
      </div>
    </section>

    <!-- Tampilan dashboard -->
    <section id="tampilanDashboard" class="d-none">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <h1 class="h3 m-0">Dashboard Portofolio</h1>
        <div class="d-flex gap-2">
          <a href="/" class="btn btn-garis btn-sm" target="_blank" rel="noopener">Lihat website</a>
          <button id="tombolKeluar" class="btn btn-garis btn-sm" type="button">Keluar</button>
        </div>
      </div>

      <ul class="nav nav-pills mb-4" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tabProyek" type="button" role="tab">Proyek</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabSertifikat" type="button" role="tab">Sertifikat</button>
        </li>
      </ul>

      <div class="tab-content">

        <!-- Tab proyek -->
        <div class="tab-pane fade show active" id="tabProyek" role="tabpanel">
          <form id="formProyek" class="kartu-kaca p-4 mb-4" enctype="multipart/form-data">
            <h2 class="h5 mb-3" data-judul-form>Tambah proyek</h2>
            <input type="hidden" name="id">
            <div class="mb-3">
              <label class="form-label" for="proyekJudul">Judul *</label>
              <input class="form-control" id="proyekJudul" name="title" maxlength="100" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="proyekDeskripsi">Deskripsi</label>
              <textarea class="form-control" id="proyekDeskripsi" name="description" rows="3" maxlength="600"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label" for="proyekTech">Teknologi (pisahkan dengan koma)</label>
              <input class="form-control" id="proyekTech" name="tech" placeholder="Node.js, Express, MySQL">
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label" for="proyekRepo">Link GitHub</label>
                <input class="form-control" id="proyekRepo" name="repoUrl" type="url" placeholder="https://github.com/...">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="proyekDemo">Link demo (jika ada)</label>
                <input class="form-control" id="proyekDemo" name="demoUrl" type="url" placeholder="https://...">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="proyekGambar">Gambar (JPG, PNG, WEBP, GIF, maks. 3 MB)</label>
              <input class="form-control" id="proyekGambar" name="gambar" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
              <div class="form-text">Saat mengubah data, kosongkan jika gambar tidak ingin diganti.</div>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-utama" type="submit" data-tombol-simpan>Simpan proyek</button>
              <button class="btn btn-garis d-none" type="button" data-tombol-batal>Batal ubah</button>
            </div>
          </form>
          <div id="daftarProyek" class="list-group"></div>
        </div>

        <!-- Tab sertifikat -->
        <div class="tab-pane fade" id="tabSertifikat" role="tabpanel">
          <form id="formSertifikat" class="kartu-kaca p-4 mb-4" enctype="multipart/form-data">
            <h2 class="h5 mb-3" data-judul-form>Tambah sertifikat</h2>
            <input type="hidden" name="id">
            <div class="mb-3">
              <label class="form-label" for="sertJudul">Nama sertifikat *</label>
              <input class="form-control" id="sertJudul" name="title" maxlength="100" required>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-8">
                <label class="form-label" for="sertPenerbit">Penerbit</label>
                <input class="form-control" id="sertPenerbit" name="issuer" maxlength="100">
              </div>
              <div class="col-md-4">
                <label class="form-label" for="sertTahun">Tahun</label>
                <input class="form-control" id="sertTahun" name="year" maxlength="10" placeholder="2026">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="sertLink">Link sertifikat (jika ada)</label>
              <input class="form-control" id="sertLink" name="credentialUrl" type="url" placeholder="https://...">
            </div>
            <div class="mb-3">
              <label class="form-label" for="sertGambar">Gambar sertifikat (maks. 3 MB)</label>
              <input class="form-control" id="sertGambar" name="gambar" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
              <div class="form-text">Saat mengubah data, kosongkan jika gambar tidak ingin diganti.</div>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-utama" type="submit" data-tombol-simpan>Simpan sertifikat</button>
              <button class="btn btn-garis d-none" type="button" data-tombol-batal>Batal ubah</button>
            </div>
          </form>
          <div id="daftarSertifikat" class="list-group"></div>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
